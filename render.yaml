# Deploy as Blueprint, or configure each service manually in Render dashboard.
services:
  # Backend API (Node + SQLite) — do NOT run "npm run build" here
  - type: web
    name: expense-tracker-api
    runtime: node
    rootDir: BE
    buildCommand: npm install --omit=dev
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "10000"

  # Frontend static site (Vite build)
  - type: web
    name: expense-tracker-web
    runtime: static
    rootDir: FE
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
